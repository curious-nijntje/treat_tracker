<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treat Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f7a8c4">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Treats">
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 2rem 1rem 6rem; /* bottom room for the tab bar */
      text-align: center;
    }

    .view[hidden] { display: none; }

    .backup { margin-top: 3rem; }
    .backup h2 { font-size: 1rem; margin-bottom: 0.25rem; }
    .hint { color: #666; font-size: 0.85rem; margin: 0 0 0.75rem; }

    /* Calendar */
    .month-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 28rem;
      margin: 0 auto 1rem;
    }
    .month-header h2 { margin: 0; font-size: 1.25rem; }
    .month-header button { font-size: 1.25rem; padding: 0.25rem 0.75rem; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      max-width: 28rem;
      margin: 0 auto;
    }
    .weekday { font-size: 0.8rem; color: #666; padding-bottom: 0.25rem; }
    .day {
      aspect-ratio: 1;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 2px;
      font: inherit;
      font-size: 0.8rem;
      color: inherit;
      background: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
    }
    .day.empty { border: none; background: none; cursor: default; }
    .day.today { border-color: #333; border-width: 2px; }
    .day.selected { background: #eef; }
    .day .icon { font-size: 1rem; line-height: 1.2; white-space: nowrap; }

    .day-picker { margin-top: 1rem; }
    .day-picker p { margin: 0 0 0.5rem; font-weight: bold; }
    .day-picker button { font-size: 1rem; padding: 0.5rem 1rem; }

    /* Bottom tab bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      border-top: 1px solid #ddd;
      background: #fff;
      padding-bottom: env(safe-area-inset-bottom); /* iPhone home bar */
    }
    .tab-bar button {
      flex: 1;
      padding: 1rem;
      font-size: 1rem;
      border: none;
      background: none;
    }
    .tab-bar button.active { font-weight: bold; border-top: 3px solid #333; }
  </style>
</head>
<body>
  <section id="view-home" class="view">
    <h1>Treat Tracker</h1>
    <p id="weekly-status"></p>
    <p id="streak"></p>
    <button id="log-treat">Log treat</button>
    <button id="no-treat">No treat</button>

    <section class="backup">
      <h2>Backup</h2>
      <p class="hint">Your data lives only on this device. Save a backup file now and then.</p>
      <button id="export-backup">Export backup</button>
      <button id="import-backup">Import backup</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
      <p id="backup-status" role="status"></p>
    </section>
  </section>

  <section id="view-calendar" class="view" hidden>
    <div class="month-header">
      <button id="prev-month" aria-label="Previous month">&larr;</button>
      <h2 id="month-title"></h2>
      <button id="next-month" aria-label="Next month">&rarr;</button>
    </div>
    <div id="calendar-grid" class="calendar-grid"></div>
    <div id="day-picker" class="day-picker" hidden>
      <p id="picked-date"></p>
      <button id="pick-treat">Treat</button>
      <button id="pick-star">Star</button>
      <button id="pick-clear">Clear</button>
    </div>
  </section>

  <nav class="tab-bar">
    <button id="tab-home" class="active">Home</button>
    <button id="tab-calendar">Calendar</button>
  </nav>

  <script src="storage.js"></script>
  <script src="weekly.js"></script>
  <script src="app.js"></script>
</body>
</html>
